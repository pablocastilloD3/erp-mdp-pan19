<script>
    /**
     * @file S_Caja.html
     * @description Controlador v5.3.0 - Gestión Agrupada, Filtros Tributarios y Resolución de Entidades.
     */

    window.Ctrl_Caja = {
        meta: {
            id: 'caja',
            titulo: 'Libro de Caja',
            icono: 'bi-cash-stack',
            descripcion: 'Gestión agrupada de egresos y conciliación de pasivos.'
        },

        estado: {
            listenerActivo: false,
            modalInstance: null,
            filtros: { periodo: 'TODO', proveedor: 'TODO' }
        },

        init: function () {
            if (!this.estado.listenerActivo) {
                window.addEventListener('erp-datos-listos', () => {
                    if (window.SISTEMA_ERP?.moduloActual === this.meta.id) this.render();
                });
                this.estado.listenerActivo = true;
            }
            const modalEl = document.getElementById('modal-caja-operativo');
            if (modalEl) {
                if (modalEl.parentNode !== document.body) document.body.appendChild(modalEl);
                this.estado.modalInstance = new bootstrap.Modal(modalEl);
            }
            this.render();
        },

        limpiarFiltros: function () {
            this.estado.filtros = { periodo: 'TODO', proveedor: 'TODO' };
            this.render();
        },

        /**
         * Resuelve el nombre real de la entidad, especialmente para registros AUT_CXP.
         */
        resolverNombreEntidad: function (fila, db, cnf) {
            if (fila.INSTITUCION !== 'AUT_CXP') return fila.INSTITUCION;

            const rawCxP = db[cnf.CXP] || [];
            const rawProv = db[cnf.PROVEEDORES] || [];
            const cxp = rawCxP.find(c => c.ID_CXP === fila.FOLIO_VINCULADO);
            if (cxp) {
                const prov = rawProv.find(p => p.RUT_ENTIDAD === cxp.RUT_PROVEEDOR);
                return prov ? prov.RAZON_SOCIAL : `PROV: ${cxp.RUT_PROVEEDOR}`;
            }
            return "PAGO AUTORIZADO (SIN VÍNCULO)";
        },

        render: function () {
            if (!window.SISTEMA_ERP?.datos || !window.CONFIG?.DB) return;

            const db = window.SISTEMA_ERP.datos;
            const cnf = window.CONFIG.DB;
            const rawData = db[cnf.CAJA] || [];

            // 1. Preparación de Datos y Resolución de Nombres
            const dataEnriquecida = rawData.map(f => ({
                ...f,
                _entidadNombre: this.resolverNombreEntidad(f, db, cnf),
                _periodo: f.FECHA_BANCO ? f.FECHA_BANCO.substring(0, 7) : 'S/F' // YYYY-MM
            }));

            // 2. Poblado de Filtros (Solo la primera vez o cuando cambien los datos)
            this.popularFiltrosUI(dataEnriquecida);

            // 3. Aplicación de Filtros
            let dataFiltrada = dataEnriquecida;
            const selectPer = document.getElementById('filtro-caja-periodo');
            const selectProv = document.getElementById('filtro-caja-proveedor');

            if (selectPer && selectPer.value !== 'TODO') {
                dataFiltrada = dataFiltrada.filter(f => f._periodo === selectPer.value);
            }
            if (selectProv && selectProv.value !== 'TODO') {
                dataFiltrada = dataFiltrada.filter(f => f._entidadNombre === selectProv.value);
            }

            // 4. Agrupamiento por Entidad
            const grupos = dataFiltrada.reduce((acc, f) => {
                if (!acc[f._entidadNombre]) acc[f._entidadNombre] = [];
                acc[f._entidadNombre].push(f);
                return acc;
            }, {});

            // 5. Ordenamiento Z -> A (por Nombre de Entidad)
            const entidadesOrdenadas = Object.keys(grupos).sort((a, b) => b.localeCompare(a));

            // 6. Construcción del Acordeón
            const contenedor = document.getElementById('view-caja-acordeon-principal');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            if (entidadesOrdenadas.length === 0) {
                contenedor.innerHTML = '<div class="alert alert-info border-2">No se encontraron movimientos para los filtros seleccionados.</div>';
            }

            entidadesOrdenadas.forEach((entidad, index) => {
                const totalGrupo = grupos[entidad].reduce((acc, f) => acc + (parseFloat(f.MONTO) || 0), 0);
                const accordionId = `acc-caja-${index}`;

                const itemHTML = `
                    <div class="accordion-item border-0 mb-2 shadow-sm">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold py-3" type="button" data-bs-toggle="collapse" data-bs-target="#${accordionId}">
                                <div class="d-flex justify-content-between w-100 me-3">
                                    <span><i class="bi bi-building me-2"></i>${entidad}</span>
                                    <span class="${totalGrupo < 0 ? 'text-danger' : 'text-success'}">
                                        ${totalGrupo.toLocaleString('es-CL', { style: 'currency', currency: 'CLP' })}
                                    </span>
                                </div>
                            </button>
                        </h2>
                        <div id="${accordionId}" class="accordion-collapse collapse" data-bs-parent="#view-caja-acordeon-principal">
                            <div class="accordion-body p-0">
                                <div id="tabla-caja-entidad-${index}" class="table-responsive"></div>
                            </div>
                        </div>
                    </div>`;

                contenedor.insertAdjacentHTML('beforeend', itemHTML);

                // Inyectar tabla de Factory para este grupo
                window.Factory.crearTabla(`tabla-caja-entidad-${index}`, {
                    data: grupos[entidad],
                    idKey: 'ID_MOVIMIENTO',
                    columns: [
                        { label: 'FECHA', key: 'FECHA_BANCO', render: v => window.ERP_Utils.formatearFecha(v) },
                        { label: 'GLOSA', key: 'DESCRIPCION_BANCO' },
                        { label: 'TIPO', key: 'TIPO', render: v => `<small class="badge bg-light text-dark">${v}</small>` },
                        {
                            label: 'MONTO', key: 'MONTO', render: v => {
                                const m = parseFloat(v) || 0;
                                return `<span class="fw-bold ${m < 0 ? 'text-danger' : 'text-success'}">${m.toLocaleString('es-CL', { style: 'currency', currency: 'CLP' })}</span>`;
                            }
                        }
                    ],
                    config: { pagination: false, search: false, columnasCRUD: false }
                });
            });

            // Actualizar Saldo General (KPI)
            const saldoTotal = dataFiltrada.reduce((acc, f) => acc + (parseFloat(f.MONTO) || 0), 0);
            document.getElementById('view-caja-saldo-total').innerText = saldoTotal.toLocaleString('es-CL', { style: 'currency', currency: 'CLP' });
            this.cargarCategorias(); // Cargar categorías del modal
        },

        popularFiltrosUI: function (data) {
            const selectPer = document.getElementById('filtro-caja-periodo');
            const selectProv = document.getElementById('filtro-caja-proveedor');
            if (!selectPer || !selectProv || selectPer.options.length > 0) return;

            // Períodos (YYYY-MM)
            const periodos = [...new Set(data.map(f => f._periodo))].sort().reverse();
            selectPer.innerHTML = '<option value="TODO">TODOS LOS PERÍODOS</option>';
            periodos.forEach(p => selectPer.add(new Option(p, p)));

            // Proveedores / Entidades
            const proveedores = [...new Set(data.map(f => f._entidadNombre))].sort();
            selectProv.innerHTML = '<option value="TODO">TODOS LOS PROVEEDORES</option>';
            proveedores.forEach(p => selectProv.add(new Option(p, p)));
        },

        cargarCategorias: function () { /* Lógica de SYS_CONFIG previa */ },
        abrirModal: function () { /* Lógica previa */ },
        ejecutar: function () { /* Lógica de UX Negativo previa */ }
    };
</script>
