<script>
    /**
     * @file S_Compras.html
     * @description Controlador v6.5.2. Quirúrgicamente alineado a V5.2.0.
     * Soporte URS-28 y jerarquía visual por proveedor.
     */

    window.Ctrl_Compras = {
        meta: {
            id: 'compras',
            titulo: 'Libro de Compras',
            icono: 'bi-cart-check-fill',
            tematica: 'Abastecimiento',
            iconoTematica: 'bi-truck',
            seguridad: { permisos: ['admin', 'compras'], nivel_acceso: 1 }
        },

        estado: {
            cargado: false,
            dataFiltrada: [],
            paginaActual: 1,
            limite: 25,
            fmt: new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 })
        },

        init: function () {
            if (this.estado.cargado) return;

            // Protocolo de Capas MDP PAN19
            const modales = document.getElementById('v-compras-modales');
            if (modales) {
                modales.classList.remove('d-none');
                document.body.appendChild(modales);
            }

            this.estado.dataFiltrada = [...(window.SISTEMA_ERP.datos['LIBRO_COMPRAS'] || [])];

            this.hidratarFiltros();
            this.render();
            this.estado.cargado = true;
        },

        /**
         * @description Helper URS-28: Parseo de celda multi-recurso.
         */
        _parseLinks: function (jsonStr) {
            try { return JSON.parse(jsonStr || '{}'); } catch (e) { return { xml: null, pdf: null }; }
        },

        _getNetoEfectivo: function (c) {
            if (c.TIPO_DTE == 33 || c.TIPO_DTE == 34) return Number(c.MONTO_NETO || 0);
            if (c.TIPO_DTE == 61) return -Number(c.MONTO_NETO || 0);
            return 0;
        },

        hidratarFiltros: function () {
            const provs = [...new Set(this.estado.dataFiltrada.map(it => it.RAZON_SOCIAL))].sort();
            const select = document.getElementById('filter-compras-prov');
            if (select) {
                select.innerHTML = '<option value="">TODOS LOS PROVEEDORES</option>' +
                    provs.map(p => `<option value="${p}">${p}</option>`).join('');
            }
        },

        filtrar: function () {
            const b = document.getElementById('search-compras').value.toUpperCase();
            const p = document.getElementById('filter-compras-prov').value;

            this.estado.dataFiltrada = (window.SISTEMA_ERP.datos['LIBRO_COMPRAS'] || []).filter(it => {
                const matchBusqueda = it.FOLIO.toString().includes(b) || it.RUT_EMISOR.includes(b) || it.RAZON_SOCIAL.includes(b);
                const matchProv = p === "" || it.RAZON_SOCIAL === p;
                return matchBusqueda && matchProv;
            });

            this.estado.paginaActual = 1;
            this.render();
        },

        cambiarLimite: function (val) {
            this.estado.limite = parseInt(val);
            this.estado.paginaActual = 1;
            this.render();
        },

        render: function () {
            const contenedor = document.getElementById('v-compras-acordeon');
            if (!contenedor) return;

            // KPIs (Aislado de la paginación para precisión total)
            let tNeto = 0, tIva = 0, tTotal = 0;
            this.estado.dataFiltrada.forEach(c => {
                const factor = (c.TIPO_DTE == 61) ? -1 : 1;
                tNeto += Number(c.MONTO_NETO || 0) * factor;
                tIva += Number(c.MONTO_IVA || 0) * factor;
                tTotal += Number(c.MONTO_TOTAL || 0) * factor;
            });

            document.getElementById('kpi-compras-neto').innerText = this.estado.fmt.format(tNeto);
            document.getElementById('kpi-compras-iva').innerText = this.estado.fmt.format(tIva);
            document.getElementById('kpi-compras-total').innerText = this.estado.fmt.format(tTotal);

            // Paginación y Agrupación
            const inicio = (this.estado.paginaActual - 1) * this.estado.limite;
            const items = this.estado.dataFiltrada.slice(inicio, inicio + this.estado.limite);

            // Lógica de Agrupación por Proveedor (Surgical Fix)
            let lastProv = null;
            let html = items.map((it, idx) => {
                const links = this._parseLinks(it.URL_XML_PDF);
                const colorDTE = it.TIPO_DTE == 61 ? 'text-danger' : 'text-dark';
                const sign = it.TIPO_DTE == 61 ? '-' : '';

                let provHeader = '';
                if (it.RAZON_SOCIAL !== lastProv) {
                    provHeader = `
                    <div class="bg-light p-2 border-start border-4 border-primary mt-3 mb-1 shadow-sm d-flex justify-content-between align-items-center">
                        <small class="fw-bold text-primary text-uppercase" style="letter-spacing: 1px;">
                            <i class="bi bi-building me-2"></i>${it.RAZON_SOCIAL}
                        </small>
                        <span class="badge bg-white text-primary border border-primary" style="font-size: 0.65rem">RUT: ${it.RUT_EMISOR}</span>
                    </div>`;
                    lastProv = it.RAZON_SOCIAL;
                }

                return `
                ${provHeader}
                <div class="accordion-item border-0 border-bottom">
                    <div class="d-flex align-items-center p-3 w-100 bg-white">
                        <div class="flex-grow-1 min-w-0 me-3">
                            <div class="d-flex align-items-center mb-1">
                                <span class="badge bg-dark small me-2">${it.TIPO_DTE}</span>
                                <span class="badge bg-light text-dark border small me-2">F-${it.FOLIO}</span>
                                <span class="text-muted small">${it.FECHA_EMISION}</span>
                            </div>
                            <div class="fw-bold ${colorDTE}">${sign}${this.estado.fmt.format(it.MONTO_TOTAL)}</div>
                        </div>
                        <div class="btn-group shadow-sm">
                            ${links.pdf ? `<a href="${links.pdf}" target="_blank" class="btn btn-outline-danger btn-sm px-2"><i class="bi bi-file-earmark-pdf"></i></a>` : ''}
                            ${links.xml ? `<a href="${links.xml}" target="_blank" class="btn btn-outline-primary btn-sm px-2"><i class="bi bi-file-earmark-code"></i></a>` : ''}
                            <button onclick="Ctrl_Compras.verFolio('${it.ID_UUID}')" class="btn btn-outline-secondary btn-sm px-2"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            contenedor.innerHTML = html || '<div class="p-5 text-center text-muted">Sin documentos.</div>';
            this.renderPaginacion(Math.ceil(this.estado.dataFiltrada.length / this.estado.limite));
        },

        renderPaginacion: function (totalPaginas) {
            const containers = ['v-compras-paginacion-top', 'v-compras-paginacion-bottom'];
            let html = `<div class="btn-group">`;
            for (let i = 1; i <= totalPaginas; i++) {
                const active = i === this.estado.paginaActual ? 'btn-primary' : 'btn-outline-primary';
                html += `<button class="btn btn-sm ${active}" onclick="Ctrl_Compras.irPagina(${i})">${i}</button>`;
            }
            html += `</div>`;
            containers.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = totalPaginas > 1 ? html : '';
            });
        },

        irPagina: function (p) {
            this.estado.paginaActual = p;
            this.render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        verFolio: function (id) {
            const d = this.estado.dataFiltrada.find(it => it.ID_UUID === id);
            if (!d) return;

            let productos = [];
            try { productos = JSON.parse(d.DETALLE_JSON || '[]'); } catch (e) { }

            const html = `
                <div class="modal-header bg-dark text-white border-0 py-3">
                    <h5 class="modal-title fw-bold"><i class="bi bi-file-earmark-text me-2"></i>DTE FOLIO ${d.FOLIO}</h5>
                    <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase fw-bold">Proveedor</label>
                            <div class="fw-bold border-start border-primary border-4 ps-2">${d.RAZON_SOCIAL}</div>
                            <div class="small text-muted">${d.RUT_EMISOR}</div>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <label class="small text-muted text-uppercase fw-bold">Emisión</label>
                            <div class="fw-bold">${d.FECHA_EMISION}</div>
                            <span class="badge bg-primary">SII: ${d.TIPO_DTE}</span>
                        </div>
                    </div>
                    <div class="table-responsive rounded shadow-sm bg-white">
                        <table class="table table-hover mb-0" style="font-size: 0.82rem;">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">#</th>
                                    <th>DETALLE</th>
                                    <th class="text-center">CANT</th>
                                    <th class="text-end">UNIT.</th>
                                    <th class="text-end pe-3">TOTAL</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${productos.map((it, i) => {
                const cant = Number(it.cantidad || it.QtyItem || 0);
                const prc = Number(it.precio || it.PrcItem || 0);
                return `
                                    <tr>
                                        <td class="text-center text-muted">${i + 1}</td>
                                        <td class="fw-bold text-uppercase">${it.nombre || it.NmbItem || 'N/A'}</td>
                                        <td class="text-center">${cant}</td>
                                        <td class="text-end text-muted">${this.estado.fmt.format(prc)}</td>
                                        <td class="text-end fw-bold pe-3 text-primary">${this.estado.fmt.format(cant * prc)}</td>
                                    </tr>`;
            }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;

            document.getElementById('modal-folio-content').innerHTML = html;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modal-folio-detalle')).show();
        }
    };

    window.SISTEMA_ERP.modulos.compras = window.Ctrl_Compras;
</script>
