<div id="view-compras" class="container-fluid py-4 spa-view d-none">
    <div class="row mb-4 pt-3 animate__animated animate__fadeIn">
        <div class="col-12">
            <h2 class="fw-bold mb-0 text-dark text-uppercase">
                <i id="v-compras-icono" class="bi bi-cart-check-fill me-2 text-primary"></i>Libro de Compras
            </h2>
            <p class="text-muted small mb-0">Control de ingresos y cumplimiento ISO 22000 / SII.</p>
        </div>
    </div>

    <div class="row mb-3 g-3">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-primary text-white text-center">
                <div class="card-body py-2">
                    <div class="small opacity-75 fw-bold text-uppercase" style="font-size:0.6rem">Neto Acumulado</div>
                    <h3 id="kpi-compras-neto" class="fw-bold mb-0">$ 0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-success text-white text-center">
                <div class="card-body py-2">
                    <div class="small opacity-75 fw-bold text-uppercase" style="font-size:0.6rem">IVA Crédito</div>
                    <h3 id="kpi-compras-iva" class="fw-bold mb-0">$ 0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-dark text-white text-center">
                <div class="card-body py-2">
                    <div class="small opacity-75 fw-bold text-uppercase" style="font-size:0.6rem">Total Ejecutado</div>
                    <h3 id="kpi-compras-total" class="fw-bold mb-0">$ 0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-3">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="bi bi-search text-muted"></i></span>
                        <input type="text" id="search-compras" class="form-control border-start-0 shadow-none"
                            placeholder="Folio, RUT o Razón Social..." onkeyup="Ctrl_Compras.filtrar()">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="filter-compras-prov" class="form-select form-select-sm shadow-none"
                        onchange="Ctrl_Compras.filtrar()">
                        <option value="">TODOS LOS PROVEEDORES</option>
                    </select>
                </div>
                <div class="col-md-4 text-md-end">
                    <div class="btn-group btn-group-sm shadow-sm">
                        <button class="btn btn-primary px-3 fw-bold" onclick="Ctrl_UpdateXML.abrirModalIngreso()">
                            <i class="bi bi-plus-lg me-1"></i> NUEVO
                        </button>
                        <button class="btn btn-light border" onclick="Ctrl_Compras.init()">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center px-1 mb-2">
        <div id="v-compras-paginacion-top"></div>
        <div class="d-flex align-items-center">
            <label class="small text-muted me-2 fw-bold">MOSTRAR:</label>
            <select id="limit-compras" class="form-select form-select-sm py-0 shadow-none" style="width: 70px;"
                onchange="Ctrl_Compras.cambiarLimite(this.value)">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
    </div>

    <div class="accordion accordion-flush shadow-sm rounded border bg-white overflow-hidden" id="v-compras-acordeon">
    </div>

    <div class="d-flex justify-content-center mt-3" id="v-compras-paginacion-bottom"></div>

    <div id="v-compras-modales" class="d-none">
        <div class="modal fade" id="modal-folio-detalle" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div id="modal-folio-content" class="modal-content border-0 shadow-lg"
                    style="border-radius: 1rem; overflow: hidden;"></div>
            </div>
        </div>
    </div>
</div>
